version: "3.8"

services:
  app:
    build: .
    container_name: node_app
    ports:
      - "5000:5000"
    environment:
      - POSTGRES_URL=postgresql://user:password@postgres:5432/taskdb
      - MONGO_URI=mongodb://mongo:27017/taskdb
    depends_on:
      - postgres
      - mongo
    volumes:
      - .:/app
    command: npm run dev

  postgres:
    image: postgres:15
    container_name: pg_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskdb
    volumes:
      - pg_data:/var/lib/postgresql/data

  mongo:
    image: mongo:6
    container_name: mongo_db
    restart: always
    volumes:
      - mongo_data:/data/db

volumes:
  pg_data:
  mongo_data: